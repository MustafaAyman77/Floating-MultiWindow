name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev automake

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.android
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.android/repositories.cfg

      - name: Build APK
        run: |
          yes | buildozer -v android debug || buildozer -v android debug

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -m1 "^version" buildozer.spec | cut -d'=' -f2 | tr -d ' ')
          echo "VERSION=${VERSION:-1.0}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date +'%Y-%m-%d_%H-%M')" >> $GITHUB_OUTPUT

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find bin -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          ls -la bin/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}-${{ github.run_number }}
          name: "Release v${{ steps.version.outputs.VERSION }} (Build ${{ github.run_number }})"
          body: |
            ## 🚀 إصدار جديد
            - **الإصدار:** ${{ steps.version.outputs.VERSION }}
            - **رقم البناء:** ${{ github.run_number }}
            - **التاريخ:** ${{ steps.version.outputs.BUILD_DATE }}

            ### 📥 التحميل
            حمّل ملف `app-debug.apk` من قسم Assets تحت.
          files: ${{ steps.find_apk.outputs.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
